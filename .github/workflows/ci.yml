name: ci

# Per-push / per-PR quality signal. The BLOCKING static + fuzz checks (gofmt/vet/govulncheck,
# shellcheck, gitleaks, UI syntax/i18n/a11y, parser fuzz) live in the reusable quality-gate.yml
# so the exact same gate also blocks the release + feed tags — one source of truth, no drift.
# This file adds the checks kept OFF the release path on purpose: the real sing-box / mihomo
# config validation (they fetch upstream cores, so they must not be able to wedge a release on a
# CDN hiccup) and the self-hosted source-builds of the engine binaries WayHop orchestrates.
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '37 5 * * 1'   # weekly — catches upstream engine-build breakage with no push
  workflow_dispatch:

permissions:
  contents: read

env:
  # Both the checks here and the release builds in build.yml run on the same Go 1.26
  # (patched stdlib); go.mod's `go 1.22` is only the language-version floor.
  GO_VERSION: '1.26.10'  # >= 1.26.10: GO-2026-6809 (crypto/x509); >= 1.26.9: GO-2026-6603 / 6605 / 6609-6613 / 6617 (net/http), 6607 (crypto/tls), 6608 (net/textproto) fixed here
  # Run the JS-based actions on the runner's bundled Node 24 (Node 20 is deprecated).
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'

jobs:
  # --- the blocking static + fuzz gate (shared verbatim with the release + feed tags) ---
  gate:
    uses: ./.github/workflows/quality-gate.yml
    # A pull request gets the fast UI subset; a push to main gets every UI gate, so main is held
    # to the same contract a release tag is.
    with:
      ui_scope: ${{ github.event_name == 'push' && github.ref == 'refs/heads/main' && 'full' || 'min' }}

  # --- validate EVERY protocol against the real sing-box core, on BOTH the
  # deployed 1.12.x line AND 1.13.x (which REMOVED the legacy wireguard outbound).
  # Native WireGuard is emitted as a top-level `endpoints` entry, so the
  # all-protocols config must pass `sing-box check` on both — this matrix proves
  # the schema is forward-compatible past the 1.13 removal. ---
  singbox-check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # 1.12.17 = the oldest line WayHop generates for; 1.13.21 = the last 1.13 release,
        # the line that removed the wireguard outbound, and what the routers run (AX3000T
        # 1.13.21, Keenetic 1.13.19, read 2026-10-29); 1.14.4 = the newest stable (2026-10-24), the
        # first line whose deprecations (independent_cache, rule-set download_detour) the
        # next minor refuses, so it also runs the CoreVersion-gated 1.14+ schema.
        # Bump deliberately when WayHop moves. sha256 = the release asset's digest as
        # GitHub publishes it (gh release view vX --json assets), checked before use.
        include:
          - { singbox: '1.12.17', sha256: '5c6cc2e753afb34a6f38802697c8040bdf6a7f3694ea67db861c1e093754f898' }
          - { singbox: '1.13.21', sha256: '24f9ef8e7234e13e71e74c3598a4164c5fe07b7b67ccc6e96cf68b54789f72cd' }
          - { singbox: '1.14.4', sha256: '699a1b510aa4396b2176d32d1181920399ebf1e267835da6f3b598d0f7c24968' }
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: '${{ env.GO_VERSION }}', cache: false}
      - name: Fetch sing-box ${{ matrix.singbox }}
        run: |
          set -euo pipefail
          ver='${{ matrix.singbox }}'
          curl -fsSL "https://github.com/SagerNet/sing-box/releases/download/v${ver}/sing-box-${ver}-linux-amd64.tar.gz" -o sb.tgz
          echo '${{ matrix.sha256 }}  sb.tgz' | sha256sum -c -
          tar -xzf sb.tgz
          echo "WR_SINGBOX=$PWD/sing-box-${ver}-linux-amd64/sing-box" >> "$GITHUB_ENV"
      # Explicit allowlist, NOT the whole package: a config with a TUN inbound (hybrid or not) carries
      # auto_redirect, and `sing-box check` initializes it, which needs a router (nftables)
      # environment and FATALs "auto-redirect: invalid argument" on a CI runner. Every other test that
      # uses WR_SINGBOX must be listed here: TestSingBoxGatedTestsRunInCI fails otherwise, and names
      # the TUN ones it lets this list skip (ciCoreCheckExcluded). TestCoreVersionRuleSetFetch RUNS the
      # core (loopback only, no TUN) because a refused rule-set download_detour fails at fetch time,
      # which `check` never reaches.
      - name: sing-box ${{ matrix.singbox }} check on all-protocols + transport + clash + WG-conf configs
        run: go test -run 'TestAllProtocolsGenerate|TestGeneratorTransportMatrix|TestClashSubscriptionGenerate|TestWireGuardConfGenerate|TestSourceRuleSingBoxCheck|TestCoreVersionSingBoxCheck|TestRoutingListTLSFragmentSingBoxCheck|TestProbeInboundSingBoxCheck|TestCoreVersionRuleSetFetch|TestRealWorldLinksSingBoxCheck|TestOpenVPNSingBoxCheck|TestSnellSingBoxCheck|TestOpenConnectSingBoxCheck|TestHysteria2ExtrasSingBoxCheck|TestHysteria2RealmSingBoxCheck|TestNDMPolicySingBoxCheck|TestCoreOverrideSingBoxCheck|TestSSHSingBoxCheck|TestECHSingBoxCheck|TestMultiplexSingBoxCheck|TestQUICTuningSingBoxCheck|TestVPNDNSServerSingBoxCheck|TestMultiplexSingBoxRuntime|TestCertificatePinSingBoxCheck|TestCertificatePinSingBoxRuntime|TestServerSetupPinSingBoxRuntime|TestWGKeyEncodingsSingBoxCheck|TestGenerateDNSSecureDefault|TestGenerateDNSH3Path|TestGenerateDNSDirectDetourIsOmitted|TestGenerateDNSDropsUnreferencedDisabledServer|TestGenerateDNSRuleSetGeoSiteAND|TestDNSRuleWithNoListLeftIsDropped' -count=1 ./internal/generator/

  # --- source-build the engine binaries WayHop orchestrates ---
  # Heavy (it clones and builds an external tree for five arches), so it is skipped
  # on PRs to keep them fast and runs on push / the weekly schedule / manual.
  engines:
    if: github.event_name != 'pull_request'
    runs-on: [self-hosted, Linux, X64]
    steps:
      # The amneziawg-go step runs this repository's own build script, so the job needs the commit it
      # is testing. Without a checkout the persistent runner's workspace held whatever an earlier job
      # left there, and the step failed with "cannot open scripts/build-amneziawg-go.sh".
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      # cache:false like every other job — this job builds an EXTERNAL clone (awg),
      # so there is nothing in this repo for setup-go to cache, and a stale module-cache
      # tarball on the self-hosted runner was failing the restore (tar exit 2).
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6
        with: { go-version: '1.26.10', cache: false }   # amneziawg-go builds on it; 1.26.9 closes the net/http advisories govulncheck reported on 1.26.6, 1.26.10 GO-2026-6809 (crypto/x509)
      # The step clones into a FRESH directory under $RUNNER_TEMP and removes it on the way out.
      # It used to clone into a fixed `awg` path in the workspace, which is fine exactly once:
      # this is a persistent self-hosted runner, so the second run met its own leftovers and the job
      # died on `destination path 'awg' already exists and is not an empty directory` — leaving main
      # red for reasons that had nothing to do with the commit that triggered it.
      # The AmneziaWG 3 component, built exactly as it is shipped: pinned to a tag AND a full commit
      # (the script refuses a moved tag), every router arch WayHop supports, size-first flags. This
      # step used to clone upstream HEAD and build arm64 only - unreproducible, and not the binary a
      # router would install.
      # Invoked exactly as scripts/verify.mjs invokes it (no arguments; output lands in the ignored
      # dist/), so check-gate-parity sees the same gate on both sides. The script itself fails
      # unless all five arches were built.
      - name: amneziawg-go (AmneziaWG 3) builds for every router arch
        run: |
          set -euo pipefail
          TMPDIR="${RUNNER_TEMP:-/tmp}" sh scripts/build-amneziawg-go.sh
