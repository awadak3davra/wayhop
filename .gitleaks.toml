# gitleaks config for WayHop — backstop that fails CI if a real secret ever lands
# in the tree or git history. The feed SIGNING keys (usign *.sec, APK *.pem) live
# ONLY in GitHub Actions secrets + off-repo backup and are .gitignore'd, so they
# must never appear here; this catches a slip.
#
# The allowlist below suppresses the repo's key-SHAPED but non-secret material:
# protocol test fixtures (WireGuard/Reality keypairs, UUIDs, sample subscriptions)
# and the PUBLIC halves of the feed keys that we intentionally ship.
title = "WayHop gitleaks"

[extend]
useDefault = true

[allowlist]
description = "test fixtures and shipped public keys carry key-shaped but non-secret bytes"
# Content-scoped (not commit-scoped, so it survives history rewrites): a key literal that
# is explicitly LABELLED a non-usable placeholder. The SSH-hardening demo path in
# internal/server/initserver.go ships `-----BEGIN OPENSSH PRIVATE KEY-----\n(demo key — not
# usable)\n-----END …-----` as its stand-in value. A real key would carry no such label, so
# this suppresses only the placeholder — an actual key landing there is still caught.
regexes = [
  '''\(demo key.{0,8}not usable\)''',
  # docs/RELEASE_SIGNING.md (in history) quotes the PEM marker INLINE as prose — the marker is
  # immediately followed by a backtick, never the newline+base64 of a real key. Content-scoped so
  # an actual key pasted into that doc (followed by base64) is still caught, unlike a path exclusion.
  '''-----BEGIN PRIVATE KEY-----`''',
]
paths = [
  '''.*_test\.go$''',
  '''.*/testdata/.*''',
  # web/dist/i18n.js is gone — the dictionaries are generated per language from web/i18n/ now — so its
  # entry went with it rather than lingering as an exclusion for a path that cannot occur.
  '''web/dist/i18n/.*\.js$''',
  # public keys are meant to ship; only their *.sec / *.pem private halves are secret
  '''packaging/feed/keys/.*\.pub$''',
  '''packaging/feed/keys/.*\.pem\.pub$''',
]
